<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisp Proxy Fetch Example</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; }
        button { padding: 8px 16px; margin-right: 10px; cursor: pointer; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Wisp Proxy Fetch Client</h1>
    <p>Using <code>@mercuryworkshop/bare-mux</code> and <code>epoxy-transport</code> from jsDelivr.</p>
    
    <button id="run-get">Fetch example.com (GET HTML)</button>
    <button id="run-post">Fetch httpbin.org (POST JSON)</button>
    
    <pre id="output">Waiting for action...</pre>

    <script type="module">
        import { BareMuxConnection, BareClient } from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2.1.9/+esm";

        const output = document.getElementById("output");

        async function setupProxy() {
            try {
                const workerCode = `importScripts("https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2.1.9/dist/worker.js");`;
                const blob = new Blob([workerCode], { type: "text/javascript" });
                const workerUrl = URL.createObjectURL(blob);

                const conn = new BareMuxConnection(workerUrl);

                await conn.setTransport(
                    "https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2.1.28/dist/index.mjs",
                    [{ wisp: "wss://123.learnhub.dedyn.io/1t4un0/" }]
                );
                
                return new BareClient();
            } catch (err) {
                console.error(err);
                output.textContent = "Setup failed. Check console for details.\n" + err;
                return null;
            }
        }

        const clientPromise = setupProxy();

        // --------------------------------------------------------
        // --------------------------------------------------------
        document.getElementById("run-get").addEventListener("click", async () => {
            const client = await clientPromise;
            if (!client) return;

            output.textContent = "Fetching https://example.com/ via Wisp proxy...";
            
            try {
                const response = await client.fetch("https://example.com/");
                const html = await response.text();
                
                output.textContent = html;
            } catch (err) {
                output.textContent = "Error: " + err;
            }
        });

        // --------------------------------------------------------
        // --------------------------------------------------------
        document.getElementById("run-post").addEventListener("click", async () => {
            const client = await clientPromise;
            if (!client) return;

            output.textContent = "Sending POST to https://httpbin.org/post...";

            try {
                const response = await client.fetch("https://httpbin.org/post", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({ 
                        proxy_protocol: "wisp", 
                        success: true,
                        message: "Hello from BareClient!"
                    })
                });
                
                const json = await response.json();
                output.textContent = JSON.stringify(json, null, 2);
            } catch (err) {
                output.textContent = "Error: " + err;
            }
        });
    </script>
</body>
</html>
