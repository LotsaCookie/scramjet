<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisp Proxy Fetch Example</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; }
        button { padding: 8px 16px; margin-right: 10px; cursor: pointer; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Wisp Proxy Fetch Client</h1>
    
    <button id="run-get">Fetch example.com (GET HTML)</button>
    <button id="run-post">Fetch JSONPlaceholder (POST JSON)</button>
    
    <pre id="output">Waiting for action...</pre>

    <script type="module">
        import { EpoxyClient } from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2.1.28/+esm";

        const output = document.getElementById("output");

        async function setupProxy() {
            try {
                const client = new EpoxyClient("wss://wisp.mercurywork.shop/");
                
                if (typeof client.init === 'function') {
                    await client.init();
                }

                return client;
            } catch (err) {
                output.textContent = err;
                return null;
            }
        }

        const clientPromise = setupProxy();

        document.getElementById("run-get").addEventListener("click", async () => {
            const client = await clientPromise;
            if (!client) return;

            output.textContent = "Fetching https://example.com/ ...";
            
            try {
                const response = await client.fetch("https://example.com/");
                const html = await response.text();
                output.textContent = html;
            } catch (err) {
                output.textContent = err;
            }
        });

        document.getElementById("run-post").addEventListener("click", async () => {
            const client = await clientPromise;
            if (!client) return;

            output.textContent = "Sending POST to jsonplaceholder.typicode.com...";

            try {
                const response = await client.fetch("https://jsonplaceholder.typicode.com/posts", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({ 
                        title: "Wisp Protocol Test", 
                        body: "Proxy connection successful",
                        userId: 1
                    })
                });
                
                const json = await response.json();
                output.textContent = JSON.stringify(json, null, 2);
            } catch (err) {
                output.textContent = err;
            }
        });
    </script>
</body>
</html>
